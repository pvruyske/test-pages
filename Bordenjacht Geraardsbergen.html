<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bordenjacht Geraardsbergen</title>
<style>
  :root { --rood:#EF4423; --donker:#A61E29; --zacht:#FDECE6; --tekst:#1F1F1F; --grijs:#6b6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Segoe UI", Calibri, Arial, sans-serif; color:var(--tekst); background:#fff7f4; }
  header { background:var(--donker); color:#fff; padding:14px 18px 12px; position:sticky; top:0; z-index:5; }
  header .tag { color:#FBD3C5; font-size:13px; font-weight:700; letter-spacing:.04em; }
  header h1 { margin:2px 0 0; font-size:22px; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  .card { background:#fff; border-radius:16px; box-shadow:0 2px 10px rgba(0,0,0,.08); overflow:hidden; margin-bottom:18px; }
  .card .top { display:flex; gap:14px; align-items:center; background:var(--zacht); padding:14px; }
  .card .top svg { width:96px; height:96px; flex:none; }
  .nr { display:inline-block; background:var(--rood); color:#fff; font-weight:800; border-radius:8px; padding:2px 9px; font-size:14px; }
  .card h2 { margin:6px 0 0; font-size:21px; line-height:1.2; }
  .body { padding:14px 16px 18px; font-size:17px; line-height:1.45; }
  .opdracht { margin-top:14px; background:#fff6f2; border:2px dashed var(--rood); border-radius:12px; padding:12px; }
  .opdracht b { color:var(--donker); }
  .opt { display:block; width:100%; text-align:left; margin:8px 0 0; padding:12px; font-size:16px; border-radius:10px; border:2px solid #e6d2cb; background:#fff; cursor:pointer; }
  .opt.fout { border-color:#c9c9c9; background:#f1f1f1; color:#888; }
  .opt.goed { border-color:#2e9e57; background:#e8f7ee; }
  input[type=text] { width:100%; padding:12px; font-size:17px; border-radius:10px; border:2px solid #e6d2cb; margin-top:8px; }
  button.go { margin-top:10px; background:var(--rood); color:#fff; border:0; border-radius:10px; padding:12px 16px; font-size:16px; font-weight:700; cursor:pointer; }
  .msg { margin-top:10px; font-weight:700; }
  .letter { margin-top:12px; background:var(--donker); color:#fff; border-radius:12px; padding:12px; text-align:center; font-size:17px; }
  .letter span { display:inline-block; background:#fff; color:var(--donker); font-size:34px; font-weight:900; width:56px; height:56px; line-height:56px; border-radius:10px; margin-top:6px; }
  .lijst a { display:flex; align-items:center; gap:12px; background:#fff; border-radius:12px; padding:10px 12px; margin-bottom:8px; color:inherit; text-decoration:none; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .lijst svg { width:44px; height:44px; flex:none; }
  .klaar { margin-left:auto; color:#2e9e57; font-weight:800; }
  .terug { display:inline-block; margin-top:6px; color:var(--donker); font-weight:700; }
  .tip { font-size:15px; color:var(--grijs); }
  .verborgen { display:none; }
</style>
</head>
<body>
<header>
  <div class="tag">#bordenjacht · Sint-Catharinacollege Geraardsbergen</div>
  <h1 id="kop">Bordenjacht Geraardsbergen</h1>
</header>
<main id="app"></main>
<script>
const CARDS = [{"n": 1, "code": "B1", "title": "Voorrang verlenen", "letter": "H", "uitleg": "Je nadert een weg waar het andere verkeer voorrang heeft. Vertraag, kijk links en rechts en laat het verkeer van beide kanten eerst gaan. Is er niemand? Dan mag je doorrijden zonder te stoppen.", "type": "mc", "q": "Wat moet je doen bij dit bord?", "opts": ["Altijd volledig stoppen", "Vertragen en het verkeer van links en rechts laten voorgaan", "Toeteren en doorrijden"], "a": 1, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><path d=\"M100 192 L8 24 Q4 14 14 14 L186 14 Q196 14 192 24 Z\" fill=\"#C1121C\"/><path d=\"M100 158 L36 34 L164 34 Z\" fill=\"#fff\"/></svg>"}, {"n": 2, "code": "B5", "title": "STOP", "letter": "E", "uitleg": "Bij dit bord moet je altijd stoppen aan de stopstreep, ook als er niemand aankomt. Daarna laat je al het verkeer voorgaan.", "type": "fill", "q": "Vul aan: bij een STOP-bord moet je altijd volledig …", "accept": ["stoppen", "stilstaan", "stoppen.", "stop"], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><polygon points=\"185.0,135.2 135.2,185.0 64.8,185.0 15.0,135.2 15.0,64.8 64.8,15.0 135.2,15.0 185.0,64.8\" fill=\"#fff\"/><polygon points=\"177.6,132.1 132.1,177.6 67.9,177.6 22.4,132.1 22.4,67.9 67.9,22.4 132.1,22.4 177.6,67.9\" fill=\"#C1121C\"/><text x=\"100\" y=\"117\" font-family=\"DejaVu Sans, Arial\" font-weight=\"bold\" font-size=\"46\" fill=\"#fff\" text-anchor=\"middle\">STOP</text></svg>"}, {"n": 3, "code": "B17", "title": "Kruispunt: voorrang van rechts", "letter": "I", "uitleg": "Je komt aan een kruispunt waar de voorrang van rechts geldt. Wie van rechts komt, mag eerst. Dat geldt voor auto's, maar ook voor fietsers en e-steps.", "type": "mc", "q": "Wie mag eerst rijden op dit kruispunt?", "opts": ["Wie van links komt", "Wie van rechts komt", "Het grootste voertuig"], "a": 1, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><path d=\"M100 8 L192 176 Q196 186 186 186 L14 186 Q4 186 8 176 Z\" fill=\"#C1121C\"/><path d=\"M100 40 L166 166 L34 166 Z\" fill=\"#fff\"/><g stroke=\"#111\" stroke-width=\"13\" stroke-linecap=\"round\"><line x1=\"74\" y1=\"92\" x2=\"126\" y2=\"150\"/><line x1=\"126\" y1=\"92\" x2=\"74\" y2=\"150\"/></g></svg>"}, {"n": 4, "code": "A23", "title": "Plaats waar veel kinderen komen", "letter": "V", "uitleg": "Dit gevaarsbord staat vaak bij scholen en speelpleinen. Kinderen kunnen plots oversteken. Rij trager en let extra goed op.", "type": "mc", "q": "Wat doe je als je dit bord ziet?", "opts": ["Sneller rijden om er snel voorbij te zijn", "Trager rijden en extra opletten", "Je gsm nemen om te navigeren"], "a": 1, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><path d=\"M100 8 L192 176 Q196 186 186 186 L14 186 Q4 186 8 176 Z\" fill=\"#C1121C\"/><path d=\"M100 40 L166 166 L34 166 Z\" fill=\"#fff\"/><circle cx=\"85.7\" cy=\"99.1\" r=\"6.8\" fill=\"#111\"/><g fill=\"none\" stroke=\"#111\" stroke-width=\"7.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"85.7,109.3 84.0,136.5\"/><polyline points=\"84.0,136.5 72.1,162.0\"/><polyline points=\"84.0,136.5 92.5,150.1 90.8,163.7\"/><polyline points=\"73.8,126.3 84.8,114.4 95.9,124.6\"/></g><circle cx=\"120.0\" cy=\"88.0\" r=\"8.0\" fill=\"#111\"/><g fill=\"none\" stroke=\"#111\" stroke-width=\"9.0\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"120.0,100.0 118.0,132.0\"/><polyline points=\"118.0,132.0 104.0,162.0\"/><polyline points=\"118.0,132.0 128.0,148.0 126.0,164.0\"/><polyline points=\"106.0,120.0 119.0,106.0 132.0,118.0\"/></g></svg>"}, {"n": 5, "code": "C1", "title": "Verboden richting", "letter": "L", "uitleg": "Je mag deze straat niet inrijden vanaf deze kant. Soms staat er een onderbord bij dat fietsers wel mogen (bijvoorbeeld een fiets met 'uitgezonderd'). Kijk dus goed!", "type": "mc", "q": "Welke uitleg past bij dit bord?", "opts": ["Hier mag je niet binnenrijden (in deze richting)", "Eenrichtingsweg: je mag erin", "Parkeren is hier verboden"], "a": 0, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><circle cx=\"100\" cy=\"100\" r=\"94\" fill=\"#fff\"/><circle cx=\"100\" cy=\"100\" r=\"88\" fill=\"#C1121C\"/><rect x=\"34\" y=\"84\" width=\"132\" height=\"32\" fill=\"#fff\"/></svg>"}, {"n": 6, "code": "D7", "title": "Verplicht fietspad", "letter": "D", "uitleg": "Een blauw rond bord is een gebod: je moet iets doen. Met de fiets of de e-step moet je hier het fietspad gebruiken.", "type": "mc", "q": "Wie moet hier het fietspad gebruiken?", "opts": ["Voetgangers", "Fietsers en bestuurders van een e-step", "Auto's"], "a": 1, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><circle cx=\"100\" cy=\"100\" r=\"94\" fill=\"#fff\"/><circle cx=\"100\" cy=\"100\" r=\"90\" fill=\"#1C5BA8\"/><g fill=\"none\" stroke=\"#fff\" stroke-width=\"8.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"64.3\" cy=\"110.6\" r=\"23.1\"/><circle cx=\"135.7\" cy=\"110.6\" r=\"23.1\"/><polyline points=\"64.3,110.6 91.6,110.6 116.8,81.2 81.1,81.2 64.3,110.6\"/><polyline points=\"91.6,110.6 76.9,70.7\"/><polyline points=\"68.5,69.7 87.4,69.7\"/><polyline points=\"135.7,110.6 114.7,66.5 127.3,64.4\"/></g></svg>"}, {"n": 7, "code": "E3", "title": "Stilstaan en parkeren verboden", "letter": "I", "uitleg": "Met een kruis in het bord mag je hier niet parkeren én niet stilstaan. Ook niet even om iemand te laten uitstappen.", "type": "tf", "q": "Juist of fout? Hier mag een auto even stoppen om jou af te zetten.", "a": false, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><circle cx=\"100\" cy=\"100\" r=\"94\" fill=\"#C1121C\"/><circle cx=\"100\" cy=\"100\" r=\"74\" fill=\"#1C5BA8\"/><line x1=\"48\" y1=\"48\" x2=\"152\" y2=\"152\" stroke=\"#C1121C\" stroke-width=\"20\"/><line x1=\"152\" y1=\"48\" x2=\"48\" y2=\"152\" stroke=\"#C1121C\" stroke-width=\"20\"/></svg>"}, {"n": 8, "code": "F19", "title": "Eenrichtingsweg", "letter": "G", "uitleg": "Een blauw vierkant bord geeft informatie. Dit bord zegt: in deze straat rijdt het verkeer maar in één richting, de richting van de pijl.", "type": "mc", "q": "Wat betekent dit bord?", "opts": ["Je mag hier niet in", "Eenrichtingsweg: het verkeer rijdt in de richting van de pijl", "Verplicht rechtdoor voor fietsers"], "a": 1, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"12\" fill=\"#fff\"/><rect x=\"10\" y=\"10\" width=\"180\" height=\"180\" rx=\"8\" fill=\"#1C5BA8\"/><path d=\"M100 30 L146 84 L116 84 L116 170 L84 170 L84 84 L54 84 Z\" fill=\"#fff\"/></svg>"}, {"n": 9, "code": "F49", "title": "Oversteekplaats voor voetgangers", "letter": "E", "uitleg": "Hier ligt een zebrapad. Bestuurders moeten voetgangers die oversteken of willen oversteken laten voorgaan. Ben jij voetganger? Kijk toch altijd eerst links en rechts.", "type": "fill", "q": "Vul aan: dit bord toont een … voor voetgangers.", "accept": ["oversteekplaats", "zebrapad", "zebra", "oversteek"], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"12\" fill=\"#fff\"/><rect x=\"10\" y=\"10\" width=\"180\" height=\"180\" rx=\"8\" fill=\"#1C5BA8\"/><path d=\"M100 22 L178 172 L22 172 Z\" fill=\"#fff\"/><rect x=\"40\" y=\"150\" width=\"14\" height=\"16\" fill=\"#111\"/><rect x=\"66\" y=\"150\" width=\"14\" height=\"16\" fill=\"#111\"/><rect x=\"92\" y=\"150\" width=\"14\" height=\"16\" fill=\"#111\"/><rect x=\"118\" y=\"150\" width=\"14\" height=\"16\" fill=\"#111\"/><rect x=\"144\" y=\"150\" width=\"14\" height=\"16\" fill=\"#111\"/><circle cx=\"104.1\" cy=\"76.3\" r=\"8.4\" fill=\"#111\"/><g fill=\"none\" stroke=\"#111\" stroke-width=\"9.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"104.1,88.9 102.0,122.5\"/><polyline points=\"102.0,122.5 87.3,154.0\"/><polyline points=\"102.0,122.5 112.5,139.3 110.4,156.1\"/><polyline points=\"89.4,109.9 103.0,95.2 116.7,107.8\"/></g></svg>"}, {"n": 10, "code": "F4a", "title": "Begin zone 30", "letter": "I", "uitleg": "Vanaf dit bord mag je overal in de zone maximaal 30 km/u rijden, tot je een bord 'einde zone 30' ziet. In schoolomgevingen staat dit bord heel vaak.", "type": "mc", "q": "Hoe snel mag je hier maximaal rijden?", "opts": ["30 km/u", "50 km/u", "70 km/u"], "a": 0, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"10\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"4\"/><text x=\"100\" y=\"44\" font-family=\"DejaVu Sans, Arial\" font-weight=\"bold\" font-size=\"34\" fill=\"#111\" text-anchor=\"middle\">ZONE</text><circle cx=\"100\" cy=\"118\" r=\"62\" fill=\"#C1121C\"/><circle cx=\"100\" cy=\"118\" r=\"48\" fill=\"#fff\"/><text x=\"100\" y=\"140\" font-family=\"DejaVu Sans, Arial\" font-weight=\"bold\" font-size=\"56\" fill=\"#111\" text-anchor=\"middle\">30</text></svg>"}];
const app = document.getElementById('app');
function bewaar(n){ try{ const s = JSON.parse(localStorage.getItem('bj-klaar')||'[]'); if(!s.includes(n)) s.push(n); localStorage.setItem('bj-klaar', JSON.stringify(s)); }catch(e){} }
function klaarLijst(){ try{ return JSON.parse(localStorage.getItem('bj-klaar')||'[]'); }catch(e){ return []; } }
function norm(t){ return t.toLowerCase().trim().replace(/[.!]/g,''); }

function toonStart(){
  const klaar = klaarLijst();
  let h = `<p style="font-size:17px">Scan de QR-code in je bundel of kies hieronder een bord. Los de mini-opdracht op en verdien een <b>letter</b>. Met alle letters vorm je het <b>codewoord</b>.</p><div class="lijst">`;
  for (const c of CARDS) h += `<a href="#bord-${c.n}">${c.svg}<div><span class="nr">Bord ${c.n}</span><br>${c.title}</div>${klaar.includes(c.n)?'<span class="klaar">✓</span>':''}</a>`;
  h += `</div><div class="card"><div class="body"><b>Codewoord</b><p class="tip">Zet je letters in de juiste volgorde. Het woord heeft 10 letters en past bij dit thema.</p><input type="text" id="code" placeholder="Typ het codewoord"><button class="go" id="check">Controleer</button><div class="msg" id="codemsg"></div></div></div>`;
  app.innerHTML = h;
  document.getElementById('check').onclick = () => {
    const ok = norm(document.getElementById('code').value) === 'veiligheid';
    document.getElementById('codemsg').innerHTML = ok ? '🎉 Juist! Toon dit scherm aan je leerkracht voor <b>+5 bonuspunten</b>.' : 'Nog niet juist. Kijk naar je letters en probeer opnieuw.';
  };
}

function toonKaart(c){
  let opd = `<div class="opdracht"><b>Mini-opdracht</b><p style="margin:6px 0 0">${c.q}</p>`;
  if (c.type === 'mc') c.opts.forEach((o,i)=> opd += `<button class="opt" data-i="${i}">${o}</button>`);
  if (c.type === 'tf') opd += `<button class="opt" data-v="true">Juist</button><button class="opt" data-v="false">Fout</button>`;
  if (c.type === 'fill') opd += `<input type="text" id="inv" placeholder="Jouw antwoord"><button class="go" id="ok">Controleer</button>`;
  opd += `<div class="msg" id="msg"></div><div id="beloning"></div></div>`;
  app.innerHTML = `<a class="terug" href="#start">← alle borden</a>
  <div class="card"><div class="top">${c.svg}<div><span class="nr">Bord ${c.n}</span><h2>${c.title}</h2></div></div>
  <div class="body"><p style="margin:0">${c.uitleg}</p>${opd}</div></div>`;
  const msg = document.getElementById('msg');
  const goed = () => { msg.textContent = 'Goed zo!'; msg.style.color = '#2e9e57'; bewaar(c.n);
    document.getElementById('beloning').innerHTML = `<div class="letter">Jouw letter voor bord ${c.n}:<br><span>${c.letter}</span><div class="tip" style="color:#FBD3C5;margin-top:6px">Schrijf de letter op je scorekaart.</div></div>`; };
  const fout = () => { msg.textContent = 'Nog niet juist. Lees de uitleg nog eens en probeer opnieuw.'; msg.style.color = '#A61E29'; };
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const juist = c.type==='mc' ? (+b.dataset.i === c.a) : ((b.dataset.v==='true') === c.a);
    if (juist) { b.classList.add('goed'); goed(); } else { b.classList.add('fout'); fout(); }
  });
  const ok = document.getElementById('ok');
  if (ok) ok.onclick = () => { (c.accept.includes(norm(document.getElementById('inv').value))) ? goed() : fout(); };
  window.scrollTo(0,0);
}

function route(){
  const m = location.hash.match(/^#bord-(\d+)$/);
  const c = m && CARDS.find(x => x.n === +m[1]);
  if (c) toonKaart(c); else toonStart();
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
